<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" role="img" aria-label="System architecture diagram">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7b8794"/>
    </marker>
    <style>
      .lbl{font:600 12.5px Inter,system-ui,sans-serif;fill:#0f172a}
      .sub{font:11px ui-monospace,Menlo,monospace;fill:#5b6b82}
      .tier{font:700 10.5px Inter,sans-serif;fill:#5b6b82;letter-spacing:1.4px}
      .flow{stroke:#7b8794;stroke-width:1.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>

  <text class="tier" x="24" y="26">PRESENTATION — React + Vite</text>
  <rect x="24" y="36" width="1032" height="78" rx="11" fill="#f8fafc" stroke="#e3e8ef"/>
  <rect x="44" y="52" width="228" height="46" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text class="lbl" x="58" y="72">Engineering Chat</text><text class="sub" x="58" y="88">spec | knowledge | lookup</text>
  <rect x="288" y="52" width="228" height="46" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text class="lbl" x="302" y="72">Quotation Chat</text><text class="sub" x="302" y="88">price | compare | revise</text>
  <rect x="532" y="52" width="248" height="46" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text class="lbl" x="546" y="72">Drawing Studio</text><text class="sub" x="546" y="88">canvas | layers | revisions</text>
  <rect x="796" y="52" width="240" height="46" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text class="lbl" x="810" y="72">Knowledge Base</text><text class="sub" x="810" y="88">collections | facets</text>

  <text class="tier" x="24" y="152">ORCHESTRATION — FLOWISE 3.0.13 | TOOL AGENTS | llama3.1:8b @ temp 0</text>
  <rect x="24" y="162" width="1032" height="92" rx="11" fill="#faf5ff" stroke="#ddd6fe"/>
  <rect x="52" y="180" width="300" height="58" rx="8" fill="#fff" stroke="#c4b5fd"/>
  <text class="lbl" x="68" y="202">Engineering Agent</text>
  <text class="sub" x="68" y="220">spec | quote | lookup | retrieve | list</text>
  <rect x="378" y="180" width="300" height="58" rx="8" fill="#fff" stroke="#c4b5fd"/>
  <text class="lbl" x="394" y="202">Quotation Agent</text>
  <text class="sub" x="394" y="220">quote | lookup | retrieve | list</text>
  <rect x="704" y="180" width="304" height="58" rx="8" fill="#fff" stroke="#c4b5fd"/>
  <text class="lbl" x="720" y="202">Drawing Agent</text>
  <text class="sub" x="720" y="220">drawing | spec | lookup | list</text>

  <text class="tier" x="24" y="292">TOOL API — FastAPI | the contract between conversation and engineering</text>
  <rect x="24" y="302" width="1032" height="62" rx="11" fill="#f0fdfa" stroke="#99f6e4"/>
  <g class="sub" fill="#0f766e">
    <text x="44" y="330">generate_specification</text>
    <text x="200" y="330">generate_quotation</text>
    <text x="338" y="330">generate_drawing</text>
    <text x="462" y="330">generate_bom</text>
    <text x="572" y="330">lookup_project</text>
    <text x="682" y="330">retrieve_knowledge</text>
    <text x="818" y="330">list_projects</text>
    <text x="926" y="330">list_filters</text>
    <text x="44" y="350">/api/drawing/render | /from-spec | /export (SVG, DXF, PDF) | /api/bom | /api/specification/pdf | /api/datasheet/pdf</text>
  </g>

  <text class="tier" x="24" y="402">ENGINEERING CORE — deterministic Python</text>
  <rect x="24" y="412" width="1032" height="182" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/>

  <rect x="44" y="430" width="238" height="146" rx="9" fill="#fff" stroke="#86efac"/>
