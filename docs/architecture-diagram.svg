  <text class="sub" x="58" y="470">understand | classify</text>
  <text class="sub" x="58" y="486">agent_router | retriever</text>
  <text class="sub" x="58" y="502">resolver | analysis</text>
  <text class="sub" x="58" y="518">spec_template (TBD gate)</text>
  <text class="sub" x="58" y="534">validate | release_gate</text>
  <text class="sub" x="58" y="550">ledger (audit trail)</text>
  <text class="sub" x="58" y="566">catalog (14 categories)</text>

  <rect x="298" y="430" width="238" height="146" rx="9" fill="#fff" stroke="#86efac"/>
  <text class="lbl" x="312" y="452">engineering/</text>
  <text class="sub" x="312" y="470">formula_service</text>
  <text class="sub" x="312" y="486">design_standards</text>
  <text class="sub" x="312" y="502">paint_shop_service</text>
  <text class="sub" x="312" y="518">blower_service (203)</text>
  <text class="sub" x="312" y="534">material | standards</text>
  <text class="sub" x="312" y="550">unit_converter | calc</text>
  <text class="sub" x="312" y="566">rate_card (client rates)</text>

  <rect x="552" y="430" width="238" height="146" rx="9" fill="#fff" stroke="#86efac"/>
  <text class="lbl" x="566" y="452">drawing/</text>
  <text class="sub" x="566" y="470">primitives (mm vectors)</text>
  <text class="sub" x="566" y="486">views (third angle)</text>
  <text class="sub" x="566" y="502">symbols (14 glyphs)</text>
  <text class="sub" x="566" y="518">envelope | fields</text>
  <text class="sub" x="566" y="534">sheet | title_block</text>
  <text class="sub" x="566" y="550">spec_parser</text>
  <text class="sub" x="566" y="566">export (DXF, PDF)</text>

  <rect x="806" y="430" width="230" height="146" rx="9" fill="#fff" stroke="#86efac"/>
  <text class="lbl" x="820" y="452">Commercial</text>
  <text class="sub" x="820" y="470">bom (quantities)</text>
  <text class="sub" x="820" y="486">pricing (historical)</text>
  <text class="sub" x="820" y="502">pricing_intelligence</text>
  <text class="sub" x="820" y="518">quotation</text>
  <text class="sub" x="820" y="534">quotation_pdf</text>
  <text class="sub" x="820" y="550">specification_pdf</text>
  <text class="sub" x="820" y="566">datasheet_pdf</text>

  <text class="tier" x="24" y="632">DATA</text>
  <rect x="24" y="642" width="1032" height="46" rx="11" fill="#f8fafc" stroke="#e3e8ef"/>
  <text class="sub" x="44" y="670" fill="#0f172a">33 offers (JSON)</text>
  <text class="sub" x="190" y="670" fill="#0f172a">ChromaDB — vectors + rag/ retrieval</text>
  <text class="sub" x="470" y="670" fill="#0f172a">PostgreSQL — chatflows &amp; agent prompts</text>
  <text class="sub" x="800" y="670" fill="#0f172a">Redis — sessions, cache</text>

  <path class="flow" d="M540 114 L540 158"/>
  <path class="flow" d="M540 254 L540 298"/>
  <path class="flow" d="M540 364 L540 408"/>
  <path class="flow" d="M540 594 L540 638"/>
</svg>
