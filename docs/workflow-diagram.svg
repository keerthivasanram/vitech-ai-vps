<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-label="Engineering workflow diagram">
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f6f4e"/>
    </marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/>
    </marker>
    <style>
      .s{font:700 13px Inter,sans-serif;fill:#0f172a}
      .d{font:11px ui-monospace,Menlo,monospace;fill:#5b6b82}
      .n{font:600 11.5px Inter,sans-serif;fill:#2f6f4e}
      .w{font:600 11.5px Inter,sans-serif;fill:#b45309}
      .arrow{stroke:#2f6f4e;stroke-width:1.8;fill:none;marker-end:url(#b)}
      .gate{stroke:#b45309;stroke-width:1.6;fill:none;marker-end:url(#c);stroke-dasharray:5 3}
    </style>
  </defs>

  <rect x="24" y="20" width="248" height="58" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text class="s" x="40" y="44">Client requirement</text>
  <text class="d" x="40" y="63">chat | studio form | pasted spec</text>
  <path class="arrow" d="M148 78 L148 112"/>

  <rect x="24" y="114" width="248" height="66" rx="9" fill="#faf5ff" stroke="#ddd6fe"/>
  <text class="s" x="40" y="137">1 - Understand</text>
  <text class="d" x="40" y="155">intent + parameters</text>
  <text class="d" x="40" y="171">LLM, with a regex fallback</text>
  <path class="arrow" d="M148 180 L148 214"/>

  <rect x="24" y="216" width="248" height="66" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
  <text class="s" x="40" y="239">2 - Retrieve</text>
  <text class="d" x="40" y="257">nearest comparable offers</text>
  <text class="d" x="40" y="273">vector + lexical, reranked</text>
  <path class="arrow" d="M148 282 L148 316"/>

  <rect x="24" y="318" width="248" height="116" rx="9" fill="#f0fdf4" stroke="#86efac"/>
  <text class="s" x="40" y="341">3 - Resolve</text>
  <text class="d" x="40" y="359">given &gt; rule &gt; standard &gt;</text>
  <text class="d" x="40" y="375">field-level history &gt; TBD</text>
  <text class="d" x="40" y="395">size gap over 20% =&gt; demoted</text>
  <text class="d" x="40" y="411">every value carries a source</text>
  <text class="d" x="40" y="427">ledger records the trail</text>
  <path class="arrow" d="M148 434 L148 468"/>

  <rect x="24" y="470" width="248" height="92" rx="9" fill="#fffbeb" stroke="#fde68a"/>
  <text class="s" x="40" y="493">4 - Engineering review</text>
  <text class="d" x="40" y="511">cross-validate | check_historical</text>
  <text class="d" x="40" y="527">release_gate.py</text>
  <text class="w" x="40" y="549">Draft &gt; Review &gt; Customer Ready</text>

  <path class="arrow" d="M272 376 L326 376"/>

  <rect x="332" y="40" width="296" height="82" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text class="s" x="348" y="64">Specification</text>
  <text class="d" x="348" y="82">table | basis per row | TBD schedule</text>
  <text class="d" x="348" y="98">release status on the document</text>
  <text class="d" x="348" y="114">PDF on the Vitech letterhead</text>

  <rect x="332" y="136" width="296" height="82" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text class="s" x="348" y="160">GA drawing</text>
  <text class="d" x="348" y="178">3 views | dimensions | glyphs</text>
  <text class="d" x="348" y="194">legend | item list | revisions</text>
  <text class="d" x="348" y="210">SVG | DXF R12 | true-size PDF</text>

  <rect x="332" y="232" width="296" height="82" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text class="s" x="348" y="256">Bill of materials</text>
  <text class="d" x="348" y="274">quantities + weights from the spec</text>
  <text class="d" x="348" y="290">priced where the rate card reaches</text>
  <text class="d" x="348" y="306">unpriced lines named, total partial</text>

  <rect x="332" y="328" width="296" height="82" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text class="s" x="348" y="352">Quotation</text>
  <text class="d" x="348" y="370">historical anchor + cost-plus + market</text>
  <text class="d" x="348" y="386">range shown, basis kept internal</text>
  <text class="d" x="348" y="402">PDF in the client house style</text>

  <path class="arrow" d="M326 376 L326 81 L330 81"/>
  <path class="arrow" d="M326 376 L326 177 L330 177"/>
  <path class="arrow" d="M326 376 L326 273 L330 273"/>
  <path class="arrow" d="M326 376 L326 369 L330 369"/>

  <path class="arrow" d="M628 225 L688 225"/>
  <rect x="694" y="160" width="252" height="130" rx="9" fill="#f0fdf4" stroke="#86efac"/>
  <text class="s" x="710" y="184">Engineer review</text>
  <text class="d" x="710" y="204">every output is a DRAFT</text>
  <text class="d" x="710" y="220">warnings printed above the numbers</text>
  <text class="d" x="710" y="236">gaps and customer questions listed</text>
  <text class="d" x="710" y="256">revisions kept, never overwritten</text>
  <text class="n" x="710" y="280">Released = a human signature</text>

  <path class="arrow" d="M820 290 L820 330"/>
  <rect x="694" y="332" width="252" height="56" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text class="s" x="710" y="356">Issued to the customer</text>
  <text class="d" x="710" y="374">after sign-off, never automatically</text>

  <path class="gate" d="M272 516 L500 516 L500 448"/>
  <text class="w" x="298" y="534">a warning or an open gap holds the pack back</text>
</svg>
